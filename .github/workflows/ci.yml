name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:analyze
      - name: Live NCBI retrieval smoke test
        run: npm run test:fetch
      - name: Live server-side PDF ingestion smoke test
        run: npm run test:ingest
      - name: Static web export
        run: npm run export:web
        env:
          EXPO_PUBLIC_SITE_URL: https://example.invalid
